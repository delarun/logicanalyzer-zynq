# S9 probe как CMSIS-DAP по сети, режим SWD (линии J9: TX=SWCLK, RST=SWDIO, FAN1=nRESET)
#   openocd -f tools/openocd/s9probe-swd.cfg -f target/rp2040.cfg
adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host 192.168.10.253
cmsis-dap tcp port 4441
transport select swd
adapter speed 4000
# Сброс: по умолчанию программный (SYSRESETREQ по SWD), провод не нужен.
# Если nRESET/RUN цели подключён к FAN1 (пин 3) — можно аппаратный:
# reset_config srst_only srst_nogate

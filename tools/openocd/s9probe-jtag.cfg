# S9 probe как CMSIS-DAP по сети, режим JTAG (J9: TX=TCK, RST=TMS, PLUG=TDI, RX=TDO)
#   openocd -f tools/openocd/s9probe-jtag.cfg -f target/stm32f1x.cfg
adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host 192.168.10.253
cmsis-dap tcp port 4441
transport select jtag
adapter speed 4000
